  <!-- ════════════════════════════════════ -->
  <!-- GREEN SPRING — cx=50, h=20, 13 half-cycles → 260px (y:65→325) -->
  <path fill="none" stroke="#7a7a7a" stroke-width="5" stroke-linecap="round"
